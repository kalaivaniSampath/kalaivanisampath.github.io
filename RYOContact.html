<html>
<head>
    <title>Lightning Out Ryobi Contact Us Form</title>

    <script src="https://tti-emea--ksdev.sandbox.my.site.com/ryobi/lightning/lightning.out.js"></script>
</head>

<body>
    <div id="container"></div>

    <script>
        // Helper function to dynamically extract query parameters from the website URL
        function getQueryParam(param, defaultValue) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param) || defaultValue;
        }

        // Dynamically retrieve language and form name from the URL
        // Example URL usage: https://yourwebsite.com/contact?lang=cs-CZ&FormName=RYO_Contact
        let userCulture = getQueryParam("userCulture", "en-GB");
        let formName = getQueryParam("FormName") || getQueryParam("formName", "RYO_Contact");
        let flowNameWeb = "Case_ContactUsForm";

        // Simplified layout (no Enquiry Type, no Phone) — automatic for these locales.
        const SIMPLIFIED_LOCALES = ["cs-CZ", "hu-HU"];
        let showSimplifiedForm = SIMPLIFIED_LOCALES.includes(userCulture);


        $Lightning.use(
            "c:contactUsFormApp",

            function () {
                $Lightning.createComponent(
                    "c:contactUsFormLwc",
                    {
                        flowApiName: flowNameWeb,
                        formName: formName,
                        lang: userCulture,
                        showSimplifiedForm: showSimplifiedForm
                    },
                    "container",
                    function (cmp) {
                        console.log("Lightning component loaded successfully for language: " + langParam);
                    }
                );
            },

            "https://tti-emea--ksdev.sandbox.my.site.com/ryobi"
        );
    </script>
</body>
</html>
