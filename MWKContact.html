```
<script>
    function getQueryParam(param, defaultValue) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param) || defaultValue;
    }

    let userCulture = getQueryParam("userCulture", "en-GB");
    let formName = getQueryParam("formName", "MWK_Contact");
    let flowNameWeb = "MilwaukeeContactForm";

    $Lightning.use(
        "c:mwkcontactUsFormApp",

        function () {
            $Lightning.createComponent(
                "c:mwkContactUsFormLwc",
                {
                    flowApiName: flowNameWeb,
                    formName: formName,
                    lang: userCulture
                },
                "container",
                function (cmp) {
                    console.log(
                        "Lightning component loaded successfully for language: "
                        + userCulture
                    );
                }
            );
        },

        "https://tti-emea--ksdev.sandbox.my.site.com/milwaukee"
    );
</script>
