<html>
<head>
    <title>Lightning Out Milwaukee Contact Us Form</title>
    <script src="https://tti-emea--ksdev.sandbox.my.site.com/milwaukee/lightning/lightning.out.js"></script>
    <style>
        html,
        /* Lightning Flow background */
        #container lightning-flow,
        #container flowruntime-flow,
        #container flowruntime-lwc-body {
            background-color: #ab0116 !important;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <script>
        /**
         * Get a query-string parameter from the current URL.
         * If the parameter does not exist or is empty,
         * the supplied default value is returned.
         */
        function getQueryParam(param, defaultValue) {
            const urlParams = new URLSearchParams(window.location.search);
            const value = urlParams.get(param);
            if (value === null || value.trim() === "") {
                return defaultValue;
            }
            return value.trim();
        }
        /*
         * Read values from the URL.
         * ?userCulture=en-GB
         */
        const userCulture = getQueryParam("userCulture", "en-GB");
        const formName = getQueryParam("formName", "MWK_Contact");
        const flowNameWeb = "MilwaukeeContactForm";
        /*
         * Debug information.
         */
        console.log("Current URL:", window.location.href);
        console.log("userCulture query parameter:",new URLSearchParams(window.location.search).get("userCulture"));
        console.log("Final userCulture:", userCulture);
        console.log("formName:", formName);
        console.log("flowNameWeb:", flowNameWeb);
        /*
         * Load the Salesforce Lightning Out application.
         */
        $Lightning.use(
            "c:mwkcontactUsFormApp",
            function () {
                console.log(
                    "Lightning Out application loaded successfully."
                );
                /*
                 * Create the Milwaukee Contact Us LWC.
                 */
                $Lightning.createComponent(
                    "c:mwkContactUsFormLwc",
                    {
                        flowApiName: flowNameWeb,
                        formName: formName,
                        lang: userCulture
                    },
                    "container",
                    function (cmp) {
                        console.log("Lightning component loaded successfully.");
                        console.log("Language passed to LWC:",userCulture);
                        console.log("Form name passed to LWC:",formName);
                    }
                );
            },
            "https://tti-emea--ksdev.sandbox.my.site.com/milwaukee"
        );
    </script>
</body>
</html>
