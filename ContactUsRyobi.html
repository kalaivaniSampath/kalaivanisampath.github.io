<!DOCTYPE html>
<html>
<head>
    <title>Lightning Out Ryobi Contact Us Form</title>

    <!-- ✅ Correct Lightning Out script domain -->
    <script src="https://tti-emea--ksdev.sandbox.lightning.force.com/ContactUs/lightning/lightning.out.js"></script>
</head>

<body>
    <div id="container"></div>

    <script>
        let flowNameWeb = "Case_ContactUsForm";

        let params = new URLSearchParams(window.location.search);
        let uuid = params.get("id") ?? "none";
        let chatKey = params.get("chatKey") ?? "none";
        let msid = params.get("msid") ?? "none";

        // Lightning Out bootstrap
        $Lightning.use(
            "c:contactUsFormApp",

            function () {
                $Lightning.createComponent(
                    "c:contactUsFormLwc",
                    {
                        flowName: flowNameWeb,
                        chatKey: chatKey,
                        uuid: uuid,
                        msid: msid
                    },
                    "container",
                    function (cmp) {
                        console.log("Lightning component loaded successfully");
                    }
                );
            },

           // ✅ MUST be Lightning domain (not Experience Cloud site)
            "https://tti-emea--ksdev.sandbox.lightning.force.com"
        );
    </script>
</body>
</html>
