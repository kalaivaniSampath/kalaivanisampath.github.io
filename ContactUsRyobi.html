<!DOCTYPE html>
<html>
<head>
    <title>Lightning Out Ryobi Contact Us Form</title>

    <script src="https://tti-emea--ksdev.sandbox.my.site.com/ContactUs/lightning/lightning.out.js"></script>
</head>

<body>
    <div id="container"></div>

    <script>
        // Helper function to extract query parameters from the website URL
        function getQueryParam(param, defaultValue) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param) || defaultValue;
        }

        // Hardcoded Flow API name
        let flowNameWeb = "Case_ContactUsForm";

        // Dynamic userCulture extracted directly from URL parameter (defaults to "EN-US" if missing)
        let userCulture = getQueryParam("userCulture", "EN-US");

        $Lightning.use(
            "c:contactUsFormApp",

            function () {
                $Lightning.createComponent(
                    "c:contactUsFormLwc",
                    {
                        flowApiName: flowNameWeb,
                        userCulture: userCulture
                    },
                    "container",
                    function (cmp) {
                        console.log("Lightning component loaded successfully with userCulture: " + userCulture);
                    }
                );
            },

            "https://tti-emea--ksdev.sandbox.my.site.com/ContactUs"
        );
    </script>
</body>
</html>
