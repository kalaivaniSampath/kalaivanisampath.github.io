<html>
<head>
    <title>Lightning Out Ryobi Contact Us Form</title>

    <script src="https://tti-emea--ksdev.sandbox.my.site.com/ContactUs/lightning/lightning.out.js"></script>
</head>

<body>
    <div id="container"></div>

    <script>
        let flowNameWeb = "Case_ContactUsForm";
        let params = new URLSearchParams(window.location.search);
        let uuid = params.get("id") ?? "none";
        let chatKey = params.get("chatKey") ?? "none";
        let msid = params.get("msid") ?? "none";

        $Lightning.use(
            "c:contactUsFormApp",

            function () {
                $Lightning.createComponent(
                    "c:contactUsFormLwc",
                    {
                        flowApiName: flowNameWeb,
                        chatKey: chatKey,
                        uuid: uuid,
                        msid: msid
                    },
                    "container",
                    function (cmp) {
                        console.log("Lightning component loaded successfully");
                    }
                );
            },

            "https://tti-emea--ksdev.sandbox.my.site.com/ContactUs"
        );
    </script>
</body>
</html>
