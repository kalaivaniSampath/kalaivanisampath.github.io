<html>
<!DOCTYPE html>
<head>
    <title>Lightning Out Ryobi Contact Us Form</title>

    <script type="text/javascript"
        src="https://tti-emea--ksdev.sandbox.my.site.com/ContactUs/lightning/lightning.out.js">
    </script>
</head>

<body>
    <div id="container"></div>

    <script>
        let flowNameWeb = "Case_ContactUsForm";

        let params = new URLSearchParams(window.location.search);
        let uuid = params.get("id") ?? "none";
        let chatKey = params.get("chatKey") ?? "none";
        let msid = params.get("msid") ?? "none";

        // Lightning Out Bootstrap
        $Lightning.use(
            "c:contactUsFormApp",
            function () {

                $Lightning.createComponent(
                    "c:contactUsFormLwc",
                    {
                        flowName: flowNameWeb,
                        chatKey: chatKey,
                        uuid: uuid,
                        msid: msid
                    },
                    "container", // ✅ FIXED: must match div id
                    function (cmp) {
                        console.log("Lightning component loaded successfully");
                    }
                );
            },

            // ✅ IMPORTANT: Use My Domain / Experience Cloud domain only
            "https://tti-emea--ksdev.sandbox.my.site.com"
        );
    </script>
</body>
</html>
