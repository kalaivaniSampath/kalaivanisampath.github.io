<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8" />
    <!-- Standard browser translate opt-out -->
    <meta name="google" content="notranslate" />
    <!-- Edge-specific translate opt-out -->
    <meta name="microsoft-translate" content="disable" />
    <meta http-equiv="Content-Language" content="en" />
    <title>Lightning Out Ryobi Contact Us Form</title>

    <script src="https://tti-emea--uat.sandbox.my.site.com/ryobi/lightning/lightning.out.js"></script>
</head>

<body translate="no" class="notranslate">
    <div id="container" translate="no" class="notranslate"></div>

    <script>
        // ── Helper ───────────────────────────────────────────────────────────
        function getQueryParam(param, defaultValue) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param) || defaultValue;
        }

        let userCulture = getQueryParam("userCulture", "en-GB");
        let formName    = getQueryParam("formName", "RYO_Contact");
        let flowNameWeb = "Case_ContactUsForm";

        // ── Set <html lang> to exactly what the URL requests ─────────────────
        // When userCulture is "en-GB", Edge sees lang="en-GB" and knows the
        // page is already in the user's language — suppressing auto-translate.
        document.documentElement.lang = userCulture;

        $Lightning.use(
            "c:contactUsFormApp",

            function () {
                $Lightning.createComponent(
                    "c:contactUsFormLwc",
                    {
                        flowApiName: flowNameWeb,
                        formName:    formName,
                        lang:        userCulture
                    },
                    "container",
                    function (cmp) {
                        console.log("Lightning component loaded for language: " + userCulture);
                    }
                );
            },

            "https://tti-emea--uat.sandbox.my.site.com/ryobi"
        );
    </script>
</body>
</html>
