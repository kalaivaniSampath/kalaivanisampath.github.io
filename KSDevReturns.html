<html>
<head>
    <title>Lightning Out Return Form</title>
    <script src="https://tti-emea--ksdev.sandbox.my.site.com/ryobi/lightning/lightning.out.js"></script>
</head>

<body>
    <div id="container"></div>

    <script>
        // Helper function to dynamically extract query parameters from the website URL
        function getQueryParam(param, defaultValue) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param) || defaultValue;
        }

        // Dynamically retrieve language ('lang') and form name ('formName') from the URL
        // Example URL usage:
        // Unauthenticated: https://yourwebsite.com/KSDevReturns.html?userCulture=en-GB&formName=RYO_Contact
        // Authenticated:   https://yourwebsite.com/KSDevReturns.html?userCulture=en-GB&formName=RYO_Contact&authenticated=true&firstName=John&lastName=Doe&email=john.doe@example.com
        let userCulture = getQueryParam("userCulture", getQueryParam("lang", "en-GB"));
        let formName = getQueryParam("formName", getQueryParam("FormName", "RYO_Contact"));
        let flowNameWeb = "Case_Ryobi_Return";

        let authParam = getQueryParam("authenticated", getQueryParam("Authenticated", "false"));
        let isAuthenticated = (authParam === "true" || authParam === true || authParam === "1");
        let firstName = getQueryParam("firstName", getQueryParam("FirstName", "")).trim();
        let lastName = getQueryParam("lastName", getQueryParam("LastName", "")).trim();
        let email = getQueryParam("email", getQueryParam("Email", "")).trim();

        $Lightning.use(
            "c:ryobiReturnApp",

            function () {
                $Lightning.createComponent(
                    "c:ryobiReturnLightningOut",
                    {
                        flowApiName: flowNameWeb,
                        formName: formName,
                        lang: userCulture,
                        authenticated: isAuthenticated,
                        firstName: firstName,
                        lastName: lastName,
                        email: email
                    },
                    "container",
                    function (cmp) {
                        console.log("Lightning component loaded successfully");
                    }
                );
            },

            "https://tti-emea--ksdev.sandbox.my.site.com/ryobi"
        );
    </script>
</body>
</html>
