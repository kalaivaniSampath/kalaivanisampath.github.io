
<html>
<head>
    <title>Lightning Out Ryobi Returns Contact Us Form</title>

    <script src="https://tti-emea--ksdev.sandbox.my.site.com/ryobi/lightning/lightning.out.js"></script>
</head>

<body>
    <div id="container"></div>

    <script>
        // Helper function to extract URL parameters
        function getQueryParam(param, defaultValue) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param) || defaultValue;
        }

        // Retrieve website URL parameters
        let userCulture = getQueryParam("userCulture", "en-GB");
        let formName = getQueryParam("FormName",
                       getQueryParam("formName", "RYO_Contact"));

        let authenticatedParam = getQueryParam(
            "authenticated",
            getQueryParam("Authenticated", "false")
        );

        let firstName = getQueryParam(
            "firstName",
            getQueryParam("FirstName", "")
        );

        let lastName = getQueryParam(
            "lastName",
            getQueryParam("LastName", "")
        );

        let email = getQueryParam(
            "email",
            getQueryParam("Email", "")
        );

        // Convert authenticated value to Boolean
        let authenticated =
            authenticatedParam.toLowerCase() === "true" ||
            authenticatedParam === "1";

        let flowNameWeb = "Case_Ryobi_Return";

        // Initialise Lightning Out
        $Lightning.use(
            "c:ryobiReturnApp",

            function () {
                $Lightning.createComponent(
                    "c:ryobiReturnLightningOut",
                    {
                        flowApiName: flowNameWeb,
                        formName: formName,
                        lang: userCulture,

                        // Pass authentication and customer details
                        authenticated: authenticated,
                        firstName: firstName,
                        lastName: lastName,
                        email: email
                    },
                    "container",
                    function (cmp) {
                        console.log(
                            "Lightning component loaded successfully"
                        );

                        console.log("Authenticated:", authenticated);
                        console.log("First Name:", firstName);
                        console.log("Last Name:", lastName);
                        console.log("Email:", email);
                    }
                );
            },

            "https://tti-emea--ksdev.sandbox.my.site.com/ryobi"
        );
    </script>
</body>
</html>
